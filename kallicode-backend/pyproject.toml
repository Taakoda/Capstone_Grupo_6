[project]
name = "kallicode-backend"
version = "0.1.0"
description = "Backend Kallicode: API del portal, webhooks e interna del pipeline + workers"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "email-validator>=2.0",
  "sqlalchemy[asyncio]>=2.0.30",
  "asyncpg>=0.29",
  "redis>=5.0",
  "httpx>=0.27",
  "pyjwt[crypto]>=2.9",
  "argon2-cffi>=23.1",
  "cryptography>=43",
  "jsonschema>=4.23",
  "anyio>=4.4",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6", "mypy>=1.11", "pgserver>=0.1.4"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.uv.workspace]
members = ["packages/core", "apps/api", "apps/workers"]

[tool.setuptools]
py-modules = []
